<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%);
            background-attachment: fixed;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .profile-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 32px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .back-btn {
            display: inline-block;
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 20px;
            transition: color 0.2s;
        }

        .back-btn:hover {
            color: #f8fafc;
        }

        .avatar-container {
            text-align: center;
            margin-bottom: 24px;
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background-color: #3b82f6;
            color: #ffffff;
            display: inline-block;
            border: 3px solid #3b82f6;
            margin-bottom: 12px;
            transition: transform 0.2s;
        }

        .avatar:hover {
            transform: scale(1.05);
        }

        .profile-card h2 {
            font-size: 20px;
            font-weight: 600;
        }

        .field-group {
            margin-bottom: 20px;
        }

        .field-group label {
            display: block;
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .input-wrapper {
            display: flex;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            overflow: hidden;
        }

        .sensitive-field {
            width: 100%;
            padding: 10px 12px;
            background: transparent;
            border: none;
            color: #f8fafc !important;
            font-size: 14px;
            outline: none;
        }

        .role-field {
            font-weight: 600;
            color: #60a5fa !important;
        }

        .save-btn {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s;
        }

        .save-btn:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

<div class="profile-card">
    <a href="javascript:history.back()" class="back-btn">&larr; Back</a>

        <form action="{{ url_for('auth.profile') }}" method="POST" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

        <div class="avatar-container">
            <label for="pfp-input" style="cursor: pointer;" title="Click to change photo">
            <img id="pfp-preview"
                 src="{{ url_for('static', filename='uploads/' + current_user.profile_picture) if current_user and current_user.profile_picture else 'https://via.placeholder.com/90' }}?v={{ range(1, 9999) | random }}"
                 alt="Profile Picture"
                 class="avatar"
                 style="object-fit: cover;">
            </label>
            <input type="file" id="pfp-input" name="profile_picture" accept="image/*" style="display: none;" onchange="previewImage(event)">
            <h2>@{{ current_user.username if current_user else 'Username' }}</h2>
        </div>

        <div class="field-group">
            <label>Role</label>
            <div class="input-wrapper">
                <input type="text" class="sensitive-field role-field"
                       value="{% if current_user %}{% if current_user.role == 'admin' or current_user.is_admin %}Admin{% else %}Customer{% endif %}{% endif %}"
                       readonly>
            </div>
        </div>

        <div class="field-group">
            <label>Email Address</label>
            <div class="input-wrapper">
                <input type="email" name="email" class="sensitive-field" value="{{ current_user.email if current_user else '' }}" required>
            </div>
        </div>

        <div class="field-group">
            <label>Password</label>
            <div class="input-wrapper">
                <input type="password" class="sensitive-field" value="••••••••••••" readonly>
            </div>
        </div>

        <button type="submit" class="save-btn">Save Profile</button>
    </form>
</div>

<script>
function previewImage(event) {
    const reader = new FileReader();
    reader.onload = () => document.getElementById('pfp-preview').src = reader.result;
    if (event.target.files[0]) reader.readAsDataURL(event.target.files[0]);
}
</script>

</body>
</html>
